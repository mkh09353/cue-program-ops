name = "cue-program-ops"
main = "src/index.ts"
compatibility_date = "2026-08-09"

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "CUE_STATE"
class_name = "CueState"
script_name = "cue-program-ops"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CueState"]

[[d1_databases]]
binding = "DB"
database_name = "cue-snapshots"
database_id = "d84c911f-2a0f-438b-b829-77cde1e13ed8"
